[build]
builder = "nixpacks"

[build.nixpacks]
aptPkgs = ["build-essential"]

[deploy]
startCommand = "cd backend && (alembic upgrade head || echo 'MIGRATION FAILED - check logs') && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
