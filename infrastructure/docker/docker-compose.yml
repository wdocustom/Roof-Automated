version: "3.9"

services:
  # -----------------------------------------------------------------------
  # PostgreSQL with pgvector
  # -----------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: roof_automated
      POSTGRES_USER: roof_user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roof_user -d roof_automated"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -----------------------------------------------------------------------
  # Temporal Server (dev mode — single binary with SQLite)
  # -----------------------------------------------------------------------
  temporal:
    image: temporalio/auto-setup:latest
    environment:
      - DB=sqlite
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
    ports:
      - "7233:7233"  # gRPC
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # -----------------------------------------------------------------------
  # Temporal Web UI
  # -----------------------------------------------------------------------
  temporal-ui:
    image: temporalio/ui:latest
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      temporal:
        condition: service_healthy

  # -----------------------------------------------------------------------
  # FastAPI Backend
  # -----------------------------------------------------------------------
  backend:
    build:
      context: ../../backend
      dockerfile: ../infrastructure/docker/Dockerfile.backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://roof_user:password@postgres:5432/roof_automated
      - DATABASE_SYNC_URL=postgresql://roof_user:password@postgres:5432/roof_automated
      - TEMPORAL_HOST=temporal:7233
      - TEMPORAL_NAMESPACE=default
      - ENVIRONMENT=development
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
    volumes:
      - ../../backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # -----------------------------------------------------------------------
  # Temporal Worker
  # -----------------------------------------------------------------------
  worker:
    build:
      context: ../../backend
      dockerfile: ../infrastructure/docker/Dockerfile.backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://roof_user:password@postgres:5432/roof_automated
      - DATABASE_SYNC_URL=postgresql://roof_user:password@postgres:5432/roof_automated
      - TEMPORAL_HOST=temporal:7233
      - TEMPORAL_NAMESPACE=default
      - ENVIRONMENT=development
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
    volumes:
      - ../../backend:/app
    command: python -m app.workflows.worker

volumes:
  pgdata:
