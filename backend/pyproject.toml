[project]
name = "roof-automated"
version = "0.1.0"
description = "Agentic AI Platform for Roofers & Siders - LangGraph + Temporal powered autonomous workflows"
requires-python = ">=3.11"
dependencies = [
    # Core framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",

    # Database
    "sqlalchemy>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pgvector>=0.3.6",

    # Auth
    "clerk-backend-api>=1.0.0",
    "python-jose[cryptography]>=3.3.0",
    "httpx>=0.28.0",

    # Temporal
    "temporalio>=1.9.0",

    # AI / LLM
    "langgraph>=0.2.60",
    "langchain-core>=0.3.28",
    "langsmith>=0.2.10",
    "litellm>=1.55.0",

    # Twilio
    "twilio>=9.4.0",

    # Payments
    "stripe>=11.4.0",

    # Utilities
    "python-multipart>=0.0.18",
    "python-dotenv>=1.0.1",
    "structlog>=24.4.0",
    "tenacity>=9.0.0",
    "boto3>=1.35.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
    "httpx>=0.28.0",
    "factory-boy>=3.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "C4", "SIM", "TCH"]
ignore = [
    "S101",  # Allow assert in tests
    "E501",  # Line length handled by formatter
    "N803",  # Argument name casing (SQLAlchemy conventions)
    "A002",  # Shadowing built-in (id, type used as field names)
    "B008",  # Function call in default argument (Depends())
    "S110",  # try-except-pass
    "B904",  # raise-without-from-inside-except
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
